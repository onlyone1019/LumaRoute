name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pin macOS 27.0 SDK for every build and test
        run: |
          source script/build_environment.sh
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
      - name: Check scripts
        run: for script in script/*.sh script/*.command; do bash -n "$script"; done
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Prepare separately distributed GEO resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/fetch_geodata.py
      - name: Test locked core downloads
        run: python3 -m unittest discover -s Tests/Scripts -p 'test_*.py'
      - name: Run host unit tests
        run: swift test --build-system native --sdk "$SDKROOT"
      - name: Rebuild frozen GEO inputs without module downloads
        run: python3 script/rebuild_geodata.py --output work/ci-geodata
      - name: Build signed application
        env:
          LUMAROUTE_ARCH: ${{ matrix.arch }}
        run: ./script/build_and_run.sh --build-only
      - name: Validate bundle signature and architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          codesign --verify --deep --strict "dist/$TARGET_ARCH/LumaRoute.app"
          test "$(lipo -archs "dist/$TARGET_ARCH/LumaRoute.app/Contents/MacOS/LumaRoute")" = "$TARGET_ARCH"
          python3 script/verify_macos_sdk.py "dist/$TARGET_ARCH/LumaRoute.app/Contents/MacOS/LumaRoute" "dist/$TARGET_ARCH/LumaRoute.app/Contents/Library/LaunchServices/LumaRouteHelper"
      - name: Continuously refresh the real connections GUI
        if: matrix.arch == 'arm64'
        run: python3 script/check_connection_table.py --products .build/arm64/arm64-apple-macosx/release --output work/connection-table-gui
      - name: Check log page navigation and native table warnings
        if: matrix.arch == 'arm64'
        run: python3 script/check_logs_page.py --products .build/arm64/arm64-apple-macosx/release --output work/logs-page-gui
      - name: Scroll live rules and check navigation memory
        if: matrix.arch == 'arm64'
        run: python3 script/check_live_rules.py --products .build/arm64/arm64-apple-macosx/release --rows 6000 --output work/live-rules-gui

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 --output checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1 "  gitleaks.tar.gz"}' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan all reachable history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts=--all --redact --ignore-gitleaks-allow --max-decode-depth 2 --no-banner --no-color'
